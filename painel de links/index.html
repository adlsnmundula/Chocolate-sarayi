<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chocolat Sarayi — Painel de links</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#2B1C14;--brown:#3E2A20;--gold:#BB8B4A;--cream:#F5E7D1;
--serif:"Playfair Display",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#6b4630 0%,transparent 60%),var(--deep);color:var(--cream);font-family:var(--sans);line-height:1.5;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{width:100%;max-width:440px;padding:48px 20px 40px}
.brand{text-align:center;margin-bottom:34px}
.mark{width:64px;height:64px;margin:0 auto 14px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.mark svg{width:32px;height:32px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;color:var(--gold);line-height:1.1}
.tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin-top:6px}
.lead{opacity:.85;margin:16px auto 0;max-width:28em;font-size:14px}
.panel{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:16px;padding:16px 18px;min-height:76px;border:1px solid #bb8b4a55;border-radius:18px;background:#3e2a20cc;transition:transform .2s,border-color .2s,background .2s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:#4a3226}
.card.main{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.card.main:hover{background:#c99a58}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#2b1c14;color:var(--gold)}
.main .ic{background:var(--deep);color:var(--cream)}
.ic svg{width:22px;height:22px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.2}
.txt span{font-size:12.5px;opacity:.78}
.arrow{flex:none;width:20px;height:20px;opacity:.8}
footer{margin-top:34px;text-align:center;font-size:12.5px;opacity:.75}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19c3-4 6-7 10-9"/></svg></div>
    <h1>Chocolat Sarayi</h1>
    <div class="tag">Luanda · Morro Bento</div>
    <p class="lead">Escolha por onde quer começar.</p>
  </div>

  <nav class="panel" aria-label="Ligações do Chocolat Sarayi" id="panel"></nav>

  <footer>Avenida 21 de Janeiro, Morro Bento, Luanda<br>Todos os dias, 06:00 – 22:00</footer>
</main>

<script>
/* Para trocar um endereço, altere só o campo "url" aqui. */
const LINKS=[
 {t:"Website do restaurante",s:"Conheça o Chocolat Sarayi",url:"https://adlsnmundula.github.io/Chocolate-sarayi/main%20website/#/menu",main:1,
  i:'<path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/><circle cx="12" cy="12" r="9"/>'},
 {t:"Menu",s:"Veja pratos, doces e bebidas",url:"https://adlsnmundula.github.io/Chocolate-sarayi/Scroll%20website/",
  i:'<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/>'},
 {t:"Instagram",s:"@chocolatesarayiluanda",url:"https://www.instagram.com/chocolatesarayiluanda/?hl=pt",
  i:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".8" fill="currentColor"/>'},
 {t:"Facebook",s:"facebook.com/chocolatesarayiluanda",url:"https://www.facebook.com/chocolatesarayiluanda",
  i:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8a1 1 0 0 1 1-1z"/>'}
];
document.getElementById("panel").innerHTML=LINKS.map(l=>`<a class="card${l.main?" main":""}" href="${l.url}" target="_blank" rel="noopener noreferrer"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${l.i}</svg></span><span class="txt"><b>${l.t}</b><span>${l.s}</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`).join("");
</script>
</body>
</html>
